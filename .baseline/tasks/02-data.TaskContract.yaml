# Task contract template for the 02-data landing. See 01-scaffold's header.
#
# `affects` names COMPONENTS, by metadata.name: the phase's retouch hook reads
# this list to decide which component.yaml files get the redeploy marker, so
# the deploy set and the task plane's statement of the work are one list.
apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The todos' D1 database exists on stage and prod, applied by Terraform, its wiring document published
  affects:
    - cloudflare-d1
  doneWhen:
    - main convergence green (terraform plan and apply on stage and prod)
    - WIRING_CLOUDFLARE_D1 exists on stage and prod
  gates: []
