apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: A reader can run, test, preview and deploy the port from the README; the as-built status is complete
  affects:
    - README.md
    - specs/epics/turso-starter/IMPLEMENTATION-STATUS.md
    - specs/epics/turso-starter/README.md
    - specs/epics/turso-starter/epic.yaml
    - specs/epics/README.md
  doneWhen:
    - README quick start is verified from a fresh clone
    - IMPLEMENTATION-STATUS lists every PR and departure
  gates: []
