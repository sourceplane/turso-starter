apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The upstream Turso starter runs on Cloudflare Workers with its todos in D1, a per-environment rendered wrangler config and green checks
  affects:
    - apps/web
    - tests/web
    - pnpm-lock.yaml
    - package.json
    - turbo.json
  doneWhen:
    - pnpm wire:fixture, typecheck, lint, test and build are green in Checks
    - wrangler dev serves the page and lists todos from the local D1
  gates:
    - checks
