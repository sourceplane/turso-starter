name: Checks

# Credential-free verification: install, render the offline wrangler fixtures,
# typecheck, lint, test and build, on every pull request, linked or not.
# `ci.yml` is the Orun pipeline beside it (plan/run with brokered Cloudflare
# credentials, deploys on merge); it plans nothing until intent.yaml names a
# workspace.
#
# PULL REQUESTS ONLY — not pushes to main. A push to main must start exactly
# one workflow, `ci.yml`, because the bootstrap's convergence watch
# (`orun.run/watch@v1` with `sha:`) takes the newest run for the merge commit
# from ANY workflow. With this one on push too, the first live bootstrap
# watched this run go green while ci.yml's deploy lanes had failed, and called
# the site converged. On main the convergence builds and tests the site
# anyway. The baseline's coverage gate holds the rule.
#
# NOT ON THE BOOTSTRAP'S OWN LANDINGS. Every phase lands on a branch named for
# its task (`orun/BASE-<n>-<phase>`) and `orun.pr/land@v1` merges it once its
# checks settle, so this job was most of each landing's wait — for a tree the
# baseline's own CI already put through these exact steps before its tag was
# cut, and that the merge builds, deploys and smoke-tests on main a minute
# later. `ci.yml`'s `plan` still checks every landing. Every other pull
# request runs this job as before.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'orun/BASE-')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Templated deployables render their wrangler config from the committed
      # fixture; an unresolved wiring token fails here, not at deploy time.
      - run: pnpm run wire:fixture
      # …and the render is what is committed. The deploy lane checks that the
      # config exists before it builds, so wrangler.jsonc is in the tree as the
      # fixture render; a template edited without re-rendering fails here.
      - name: the committed wrangler config is the fixture render
        run: git diff --exit-code
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
