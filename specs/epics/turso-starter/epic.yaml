# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (TU → TU-1, TU-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: turso-starter
  key: TU
spec:
  title: "Vercel's Next.js + Turso starter on Cloudflare Workers with D1"
  summary: "The Vercel Next.js + Turso starter — a todo list whose server actions insert and delete rows through the libSQL client, creating its table on first use — runs on Cloudflare Workers + Static Assets through @opennextjs/cloudflare with the todos in a Cloudflare D1 database provisioned by Terraform through Orun, inside the Cirrus baseline's repository conventions. Turso and D1 are both SQLite, so the SQL does not change: lib/turso.ts keeps the client's execute() shape over the D1 binding and every query stays as written. Since TU5 the table the template created on first use is a migration, applied by db-migrate between the database's apply and the Worker's deploy."
  state: started
  milestones:
    - name: "TU0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [TU-1]
    - name: "TU1 — the todos on D1"
      exitCriteria:
        - "apps/web is the upstream template with lib/turso.ts speaking to the DB D1 binding"
        - "the wrangler config renders per environment from the cloudflare-d1 root's wiring document (fixture in verify, live in deploy)"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` serves the page, creates the table in the local D1 and lists todos"
      tasks: [TU-2]
    - name: "TU2 — the D1 database from Terraform"
      exitCriteria:
        - "infra/terraform/cloudflare-d1 provisions the stage and prod databases and publishes the wiring document the app renders from"
      tasks: [TU-3]
    - name: "TU3 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, preview and deploy it"
        - "the as-built status records every departure from the upstream template"
      tasks: [TU-4]
    - name: "TU4 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new todo list from nothing to live on stage and prod in four phases, its D1 database applied by Terraform before the site deploys"
        - "a site built from it carries the site only, renamed throughout to its own name, repository, database and Worker"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier (a todo round-tripped through a local D1)"
      tasks: [TU-5]
    - name: "TU5 — a baseline, in one landing"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new todo list from nothing to live on stage and prod in ONE landing (01-product) and a hook-only record (02-docs), replacing TU4's four phases"
        - "the schema is a migration: packages/db's runner, run by an infra/db-migrate component, creates the todos table the page used to create on first use"
        - "the product's own push-to-main plan applies cloudflare-d1, then db-migrate, then deploys web, per environment, and the landing's await finds WIRING_CLOUDFLARE_D1 on stage and prod"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier (the migration lane applied against a stand-in D1 API, a todo round-tripped through a local D1)"
      tasks: [TU-6]
    - name: "TU6 — the cirrus standard"
      exitCriteria:
        - "nothing outside this milestone's own record names kiox: orun is pinned where CI runs it (the orun-action `version:` in each workflow)"
        - "every component carries generated docs/{overview,architecture,runbook}.md, and Baseline CI fails a pull request whose manifests and pages disagree"
        - "ai/context carries this repository's current.md, decisions.md and open-risks.md, and none of them ships to a product"
        - "every milestone's status row agrees with the tags"
        - "the console card reads subdomain from the Cloudflare connection (from: connection.cloudflare.workersSubdomain), as cirrus-baseline since baseline-v23"
      tasks: [TU-7, TU-8]
    - name: "TU7 — the domain is set later"
      exitCriteria:
        - "the console card asks for no domain: a site goes live on workers.dev, and productdomain is an optional build input that defaults to empty"
        - "a site built without a domain is branded with the reserved placeholder <reponame>.example.com wherever the domain goes (BASE_DOMAIN), and its README says how an owner sets the real one"
        - "Baseline CI places, leak-checks and plans a site built with no domain"
      tasks: [TU-9]
